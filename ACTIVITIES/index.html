<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Monthly Budget 💖</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap');

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #ffeef4 0%, #ffd3e2 50%, #fca1c4 100%);
            margin: 0;
            padding: 30px 15px;
            min-height: 100vh;
            color: #5a3140;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            max-width: 460px;
            width: 100%;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(235, 110, 155, 0.25);
            border: 2px solid #ffdeeb;
            box-sizing: border-box;
        }

        h2 {
            text-align: center;
            color: #b03060;
            font-size: 26px;
            font-weight: 700;
            margin-top: 0;
            margin-bottom: 20px;
            text-shadow: 1px 1px 2px rgba(255, 182, 193, 0.5);
        }

        .input-group {
            margin-bottom: 12px;
        }

        label {
            font-weight: 600;
            display: block;
            margin-bottom: 5px;
            color: #883955;
            font-size: 13px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper span {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #d87093;
            font-size: 16px;
        }

        input {
            width: 100%;
            padding: 10px 10px 10px 32px;
            border: 1.5px solid #ffc2d6;
            background-color: #fffafc;
            border-radius: 12px;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            color: #6a2c41;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }

        input:focus {
            border-color: #ff69b4;
            background-color: #ffffff;
            box-shadow: 0 0 8px rgba(255, 105, 180, 0.3);
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #ff85a2 0%, #ff527b 100%);
            color: white;
            border: none;
            border-radius: 15px;
            font-weight: 600;
            margin-top: 15px;
            cursor: pointer;
            font-size: 15px;
            letter-spacing: 0.5px;
            box-shadow: 0 5px 15px rgba(255, 82, 123, 0.4);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 20px rgba(255, 82, 123, 0.6);
        }

        .results {
            margin-top: 25px;
            background: #fff0f5;
            padding: 18px;
            border-radius: 18px;
            border: 1.5px dashed #ffa6c9;
        }

        .results-header {
            text-align: center;
            font-weight: 700;
            color: #a82e58;
            margin-bottom: 12px;
            font-size: 15px;
        }

        .row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 14px;
            color: #6a2c41;
        }

        .status-ok {
            color: #2e8b57;
            font-weight: 700;
            background: #e8f8f0;
            padding: 2px 8px;
            border-radius: 8px;
        }

        .status-over {
            color: #d93856;
            font-weight: 700;
            background: #ffe8ec;
            padding: 2px 8px;
            border-radius: 8px;
        }

        hr {
            border: 0;
            border-top: 1px dashed #ffb6c1;
            margin: 10px 0;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>✨ My Monthly Budget 🌸</h2>
    
    <div class="input-group">
        <label for="income">💵 Monthly Income</label>
        <div class="input-wrapper">
            <span>₱</span>
            <input type="number" id="income" value="25000">
        </div>
    </div>

    <div class="input-group">
        <label for="rent">🏠 Housing / Rent</label>
        <div class="input-wrapper">
            <span>₱</span>
            <input type="number" id="rent" value="8000">
        </div>
    </div>

    <div class="input-group">
        <label for="food">🛍️ Food & Lifestyle</label>
        <div class="input-wrapper">
            <span>₱</span>
            <input type="number" id="food" value="6000">
        </div>
    </div>

    <div class="input-group">
        <label for="utilities">☕ Utilities & Treats</label>
        <div class="input-wrapper">
            <span>₱</span>
            <input type="number" id="utilities" value="3000">
        </div>
    </div>

    <div class="input-group">
        <label for="savingsRate">💖 Target Savings Goal (%)</label>
        <div class="input-wrapper">
            <span>%</span>
            <input type="number" id="savingsRate" value="20">
        </div>
    </div>

    <button onclick="calculateBudget()">Calculate Total 🎀</button>

    <div class="results" id="output" style="display:none;">
        <div class="results-header">🌸 Budget Breakdown 🌸</div>
        <div class="row"><span>Total Income:</span> <strong id="resIncome">₱0.00</strong></div>
        <div class="row"><span>Total Expenses:</span> <span id="resExpenses">₱0.00</span></div>
        <div class="row"><span>Allocated Savings:</span> <span id="resSavings">₱0.00</span></div>
        <hr>
        <div class="row"><span>Remaining Balance:</span> <strong id="resBalance">₱0.00</strong></div>
        <div class="row"><span>Budget Status:</span> <span id="resStatus">---</span></div>
    </div>
</div>

<script>
    function calculateBudget() {
        let income = parseFloat(document.getElementById('income').value) || 0;
        let rent = parseFloat(document.getElementById('rent').value) || 0;
        let food = parseFloat(document.getElementById('food').value) || 0;
        let utilities = parseFloat(document.getElementById('utilities').value) || 0;
        let savingsRate = parseFloat(document.getElementById('savingsRate').value) || 0;

        // Core Calculations
        let totalExpenses = rent + food + utilities;
        let savingsAmount = income * (savingsRate / 100);
        let remainingBalance = income - totalExpenses - savingsAmount;

        // Render Results
        document.getElementById('resIncome').innerText = "₱" + income.toLocaleString('en-US', {minimumFractionDigits: 2});
        document.getElementById('resExpenses').innerText = "₱" + totalExpenses.toLocaleString('en-US', {minimumFractionDigits: 2});
        document.getElementById('resSavings').innerText = "₱" + savingsAmount.toLocaleString('en-US', {minimumFractionDigits: 2});
        document.getElementById('resBalance').innerText = "₱" + remainingBalance.toLocaleString('en-US', {minimumFractionDigits: 2});

        let statusElement = document.getElementById('resStatus');
        if (remainingBalance >= 0) {
            statusElement.innerText = "Within Budget 💕";
            statusElement.className = "status-ok";
        } else {
            statusElement.innerText = "Over Budget 💔";
            statusElement.className = "status-over";
        }

        document.getElementById('output').style.display = 'block';
    }
</script>

</body>
</html>
