<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>JS Activities Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="sidebar">
        <h3>EXERCISES</h3>
        
        <button class="drop-btn" onclick="toggleMenu('ex2Menu')">Exercise #2 ▼</button>
        <div id="ex2Menu" class="menu-content" style="display:none;">
            <button onclick="runActivity1()">Activity 1</button>
            <button onclick="runActivity2()">Activity 2</button>
            <button onclick="runActivity3()">Activity 3</button>
            <button onclick="runActivity4()">Activity 4</button>
            <button onclick="runActivity5()">Activity 5</button>
            <button onclick="runActivity6()">Activity 6</button>
            <button onclick="runActivity7()">Activity 7</button>
        </div>

        <button class="drop-btn" onclick="toggleMenu('ex3Menu')" style="margin-top:10px;">Exercise #3 ▼</button>
        <div id="ex3Menu" class="menu-content" style="display:none;">
            <button onclick="ex3Activity1()">Activity 1</button>
            <button onclick="ex3Activity2()">Activity 2</button>
            <button onclick="ex3Activity3()">Activity 3</button>
            <button onclick="ex3Activity4()">Activity 4</button>
            <button onclick="ex3Activity5()">Activity 5</button>
            <button onclick="ex3Activity6()">Activity 6</button>
            <button onclick="ex3Activity7()">Activity 7</button>
            <button onclick="ex3Activity8()">Activity 8</button>
        </div>
    </div>





    <div class="main-content">
    <div class="container-center">
        <div class="glass-card">
            <div class="header-card">
                <h1>🌸 My JS Activities 🌸</h1>
                <p>Select an activity from the sidebar to begin.</p>
            </div>

            <hr class="divider-line"> <div id="display-area">
                <div id="exercise-output">
                    <p>Activity results will appear here.</p>
                </div>
            </div>
        </div>
    </div>
</div>
        
    <script src="script.js"></script>
</body>
</html>
