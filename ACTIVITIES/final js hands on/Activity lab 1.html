<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Pinky Website</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background-color: #ffe6f0;
            color: #4d004d;
        }

        /* HEADER */
        header {
            background: linear-gradient(to right, #ff66b2, #ff99cc);
            color: white;
            padding: 25px;
            text-align: center;
            font-size: 24px;
            letter-spacing: 2px;
        }

        /* NAVIGATION */
        nav {
            background-color: #ff99cc;
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 12px 0;
            position: sticky;
            top: 0;
        }

        nav a {
            text-decoration: none;
            color: white;
            font-weight: bold;
            padding: 8px 18px;
            border-radius: 20px;
            transition: 0.3s;
        }

        nav a:hover {
            background-color: #ff4da6;
        }

        /* MAIN LAYOUT */
        .container {
            display: flex;
            flex: 1;
        }

        /* SIDEBAR */
        aside {
            width: 250px;
            background-color: #ffcce6;
            padding: 20px;
            border-right: 3px solid #ff99cc;
        }

        aside h3 {
            margin-bottom: 15px;
            text-align: center;
        }

        aside ul {
            list-style: none;
        }

        aside ul li {
            margin: 10px 0;
            padding: 8px;
            background-color: #ffb3d9;
            border-radius: 15px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
        }

        aside ul li:hover {
            background-color: #ff66b2;
            color: white;
        }

        /* MAIN CONTENT */
        main {
            flex: 1;
            padding: 40px;
        }

        .profile {
            text-align: center;
            background-color: #ffd6eb;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 5px 10px rgba(0,0,0,0.1);
            max-width: 400px;
            margin: auto;
        }

        .profile img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 5px solid #ff66b2;
            margin-bottom: 15px;
        }

        /* FOOTER */
        footer {
            background-color: #ff66b2;
            color: white;
            text-align: center;
            padding: 15px;
            margin-top: auto;
        }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }

            aside {
                width: 100%;
                border-right: none;
                border-bottom: 3px solid #ff99cc;
            }
        }
    </style>
</head>

<body>

    <header>
        🌸 Welcome to my Website 🌸
    </header>

    <nav>
        <a href="#">Home</a>
        <a href="#">About Me</a>
        <a href="#">Contact</a>
    </nav>

    <div class="container">
        
        <aside>
            <h3> Menu</h3>
            <ul>
                <li>My Profile</li>
                <li>My Hobbies</li>
                <li>My Favorites</li>
                <li>Gallery</li>
            </ul>
        </aside>

        <main>
            <div class="profile">
                <img src="pfp.jpg" alt="Profile Picture">
                <h2> Mariene Kaye Espera</h2>
                <p>Hello! I'm Kaye Espera, Welcome to my personal website.  
                I love designing cute websites and learning new things!</p>
            </div>
        </main>

    </div>

    <footer>
        &copy; 2026 Kaye Espera | Made with 💕
    </footer>

</body>
</html>
